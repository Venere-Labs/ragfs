version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    ignore:
      # dtolnay/rust-toolchain git tags are rustc versions (1.91, 1.120, …),
      # not action releases. Bumping the tag changes the MSRV compiler.
      - dependency-name: "dtolnay/rust-toolchain"

  - package-ecosystem: "pip"
    directory: "/crates/ragfs-python"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps(python)"

  - package-ecosystem: "pip"
    directory: "/crates/ragfs-mcp"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps(mcp)"
