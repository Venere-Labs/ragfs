version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"
    ignore:
      # lancedb 0.38+ (and 0.39.0) does not compile with default features:
      # src/job.rs uses Error::Http while that variant is cfg(feature="remote").
      # Arrow 60 is coupled to a future lancedb bump; keep 58 until then.
      - dependency-name: "lancedb"
        versions: [">=0.38.0"]
      - dependency-name: "arrow-array"
        versions: [">=59"]
      - dependency-name: "arrow-schema"
        versions: [">=59"]
      # 0.x "minor" is a breaking bump (criterion 0.5→0.8 compiled benches
      # against a deprecated black_box and raced the Lab stack). Keep patch.
      - dependency-name: "criterion"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "notify-debouncer-full"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "tokenizers"
        update-types: ["version-update:semver-minor"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    ignore:
      # dtolnay/rust-toolchain git tags are rustc versions (1.91, 1.120, …),
      # not action releases. Bumping the tag changes the MSRV compiler.
      - dependency-name: "dtolnay/rust-toolchain"

  - package-ecosystem: "pip"
    directory: "/crates/ragfs-python"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps(python)"

  - package-ecosystem: "pip"
    directory: "/crates/ragfs-mcp"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps(mcp)"
