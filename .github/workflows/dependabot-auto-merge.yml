name: Dependabot auto-merge

on:
  pull_request:

permissions:
  contents: write
  pull-requests: write

jobs:
  dependabot:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge (patch/minor + Actions)
        if: >-
          steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          steps.metadata.outputs.update-type == 'version-update:semver-minor' ||
          steps.metadata.outputs.package-ecosystem == 'github_actions'
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPENDENCY_NAMES: ${{ steps.metadata.outputs.dependency-names }}
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
        run: |
          set -euo pipefail
          # Skip megagroups (>20 deps) — keep majors/groups manual
          IFS=',' read -r -a DEPS <<< "${DEPENDENCY_NAMES:-}"
          # trim empties
          count=0
          for d in "${DEPS[@]+"${DEPS[@]}"}"; do
            [ -n "${d// }" ] && count=$((count+1))
          done
          if [ "$count" -gt 20 ]; then
            echo "Skip auto-merge: dependency group has $count packages (>20)"
            exit 0
          fi
          if [ "${UPDATE_TYPE:-}" = "version-update:semver-major" ]; then
            echo "Skip auto-merge: semver-major"
            exit 0
          fi
          gh pr merge --auto --squash "$PR_URL"
