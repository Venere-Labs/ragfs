name: Dependabot auto-merge

on:
  pull_request:

permissions:
  contents: write
  pull-requests: write

jobs:
  dependabot:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge (patch/minor + Actions)
        if: >-
          steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          steps.metadata.outputs.update-type == 'version-update:semver-minor' ||
          steps.metadata.outputs.package-ecosystem == 'github-actions'
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPENDENCY_NAMES: ${{ steps.metadata.outputs.dependency-names }}
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
          NEW_VERSION: ${{ steps.metadata.outputs.new-version }}
        run: |
          set -euo pipefail
          # Skip megagroups (>20 deps) — keep majors/groups manual
          IFS=',' read -r -a DEPS <<< "${DEPENDENCY_NAMES:-}"
          # trim empties
          count=0
          for d in "${DEPS[@]+"${DEPS[@]}"}"; do
            [ -n "${d// }" ] && count=$((count+1))
          done
          if [ "$count" -gt 20 ]; then
            echo "Skip auto-merge: dependency group has $count packages (>20)"
            exit 0
          fi
          if [ "${UPDATE_TYPE:-}" = "version-update:semver-major" ]; then
            echo "Skip auto-merge: semver-major"
            exit 0
          fi
          # Cargo 0.x treats a minor as breaking (tokenizers 0.22→0.23).
          case "${NEW_VERSION:-}" in
            0.*)
              if [ "${UPDATE_TYPE:-}" = "version-update:semver-minor" ]; then
                echo "Skip auto-merge: 0.x minor ${NEW_VERSION}"
                exit 0
              fi
              ;;
          esac
          set +e
          out=$(gh pr merge --auto --squash "$PR_URL" 2>&1)
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "$out"
            exit 0
          fi
          echo "$out"
          case "$out" in
            *"already enabled"*|*"Protected branch rules not configured"*)
              echo "auto-merge enable non-fatal"
              exit 0
              ;;
          esac
          exit "$rc"
