[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ragfs-mcp"
version = "0.2.1"
description = "MCP server for RAGFS semantic filesystem"
readme = "README.md"
license = { text = "MIT OR Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "Gianluca Mazza", email = "info@gianlucamazza.it" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
keywords = ["rag", "semantic-search", "mcp", "ai", "claude"]
dependencies = [
    "mcp>=1.2.0,<3",
    "ragfs>=0.2.0",
    "blake3>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
]

[project.scripts]
ragfs-mcp = "ragfs_mcp:run"

[project.entry-points."mcp.servers"]
ragfs = "ragfs_mcp:create_server"

[project.urls]
Homepage = "https://github.com/gianlucamazza/ragfs"
Documentation = "https://gianlucamazza.github.io/ragfs/"
Repository = "https://github.com/gianlucamazza/ragfs"
Issues = "https://github.com/gianlucamazza/ragfs/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/ragfs_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
