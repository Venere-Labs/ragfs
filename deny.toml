# cargo-deny configuration
# Run with: cargo deny check

[graph]
# Only check dependencies of default features
all-features = false

[advisories]
# Advisory database to check against
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]

# How to handle advisories
# Note: In cargo-deny v2, advisories are denied by default
# The unmaintained field uses scope ("all", "workspace", "transitive", "none")
unmaintained = "workspace"  # Only fail for direct workspace dependencies
yanked = "warn"

# Ignore specific advisories (with justification)
# These are transitive dependencies that cannot be easily upgraded without major refactoring
ignore = [
    # aws-lc-sys vulnerabilities - transitive via lancedb/arrow dependencies
    "RUSTSEC-2026-0044",  # X.509 Name Constraints Bypass via Wildcard/Unicode CN
    "RUSTSEC-2026-0045",  # Timing Side-Channel in AES-CCM Tag Verification
    "RUSTSEC-2026-0046",  # PKCS7_verify Certificate Chain Validation Bypass
    "RUSTSEC-2026-0047",  # PKCS7_verify Signature Validation Bypass
    "RUSTSEC-2026-0048",  # CRL Distribution Point Scope Check Logic Error
    "RUSTSEC-2026-0258",  # Name constraints for URI names incorrectly accepted
    "RUSTSEC-2026-0285",  # CRLs not considered authoritative by Distribution Point
    
    # pyo3 vulnerabilities - transitive via Python bindings
    "RUSTSEC-2026-0098",  # Out-of-bounds read in nth/nth_back for PyList/PyTuple iterators
    "RUSTSEC-2026-0099",  # Missing Sync bound on PyCFunction::new_closure closures
    
    # quick-xml vulnerabilities - transitive via datafusion/arrow
    "RUSTSEC-2026-0187",  # Quadratic run time checking start tag for duplicate attributes
    "RUSTSEC-2026-0194",  # Unbounded namespace-declaration allocation in NsReader
    "RUSTSEC-2026-0195",  # Quadratic run time checking start tag for duplicate attributes (duplicate)
    "RUSTSEC-2026-0204",  # Unbounded namespace-declaration allocation (duplicate)
    
    # Other transitive vulnerabilities
    "RUSTSEC-2026-0041",  # lz4_flex: Decompressing invalid data can leak uninitialized memory
    "RUSTSEC-2026-0009",  # crossbeam-epoch: Invalid pointer dereference in fmt::Pointer impl
    "RUSTSEC-2026-0176",  # lopdf: Stack overflow via deeply nested PDF objects
    "RUSTSEC-2026-0177",  # rustls/webpki: TLS 1.3 handshake messages accepted across encryption levels
    "RUSTSEC-2025-0069",  # webpki: Name constraints accepted for wildcard certificates
    "RUSTSEC-2026-0049",  # webpki: Reachable panic in certificate revocation list parsing
    "RUSTSEC-2023-0071",  # rsa: Marvin Attack - timing sidechannel key recovery (unmaintained)
    
    # Unmaintained crates used by FUSE
    "RUSTSEC-2026-0104",  # daemonize is unmaintained
]

[licenses]
# Ensure licenses are compatible with our dual MIT/Apache-2.0 license
# Note: In cargo-deny v2, unlicensed and copyleft are denied by default
# Only need to specify allowed licenses

# Allowed licenses
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",          # Boost Software License - used by xxhash-rust
    "ISC",
    "Zlib",
    "0BSD",
    "Unicode-3.0",
    "MPL-2.0",
    "CC0-1.0",
    "OpenSSL",
    "NCSA",             # NCSA License - used by libfuzzer-sys
    "bzip2-1.0.6",      # bzip2 License - used by libbz2-rs-sys
    "CDLA-Permissive-2.0",  # Community Data License - used by webpki-roots
]

# Allow specific crates with non-standard licenses
exceptions = []

# Clarify licenses for crates where detection fails
[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
# Lint multiple versions of the same crate
multiple-versions = "warn"

# Don't allow wildcard dependencies (except workspace)
wildcards = "allow"  # Workspace dependencies use .workspace = true which is treated as wildcard

# Allow workspace dependencies
workspace-default-features = "allow"

# Deny specific crates
deny = []

# Allow specific duplicate crates (when justified)
skip = [
    # Multiple versions needed for transitive dependency compatibility
    { crate = "base64", reason = "Multiple versions required by different deps" },
    { crate = "bitflags", reason = "v1 and v2 both needed" },
    { crate = "zune-jpeg", reason = "Different versions from image and tiff deps" },
]

[sources]
# Only allow crates from crates.io
unknown-registry = "deny"
unknown-git = "deny"

# Allow crates from crates.io
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

# Allow specific git repos (e.g., for workspace members)
allow-git = []
