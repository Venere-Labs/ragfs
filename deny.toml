# cargo-deny configuration
# Run with: cargo deny check
#
# Schema matches current cargo-deny (0.18+/0.20): advisory severity keys
# (`vulnerability`, `notice`) and `build-script-allow-network` are gone.
# `unmaintained` is a scope, not a lint level.

[graph]
# Only check dependencies of default features
all-features = false

[advisories]
# Advisory database to check against
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]

# Scope, not deny/warn: do not fail CI on transitive unmaintained crates
# (previous config used unmaintained = "warn").
unmaintained = "workspace"
yanked = "warn"

# Transitive advisories that cannot be upgraded without a product refactor.
# These were already present in the graph; listing them keeps cargo-deny
# valid after the schema parse succeeds.
ignore = [
    # aws-lc-sys — transitive via lancedb/arrow
    "RUSTSEC-2026-0044",
    "RUSTSEC-2026-0045",
    "RUSTSEC-2026-0046",
    "RUSTSEC-2026-0047",
    "RUSTSEC-2026-0048",
    "RUSTSEC-2026-0258",
    "RUSTSEC-2026-0285",

    # pyo3 — Python bindings
    "RUSTSEC-2026-0098",
    "RUSTSEC-2026-0099",

    # quick-xml — transitive via datafusion/arrow
    "RUSTSEC-2026-0187",
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",
    "RUSTSEC-2026-0204",

    # Other transitive
    "RUSTSEC-2026-0041",
    "RUSTSEC-2026-0009",
    "RUSTSEC-2026-0176",
    "RUSTSEC-2026-0177",
    "RUSTSEC-2025-0069",
    "RUSTSEC-2026-0049",
    "RUSTSEC-2023-0071",

    # Unmaintained crates used by FUSE
    "RUSTSEC-2026-0104",
]

[licenses]
# Unlicensed / copyleft / default are implicit deny in current cargo-deny.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "Zlib",
    "0BSD",
    "Unicode-3.0",
    "MPL-2.0",
    "CC0-1.0",
    "OpenSSL",
    "NCSA",
    "bzip2-1.0.6",
    "CDLA-Permissive-2.0",
]

exceptions = []

[[licenses.clarify]]
crate = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
multiple-versions = "warn"
# Workspace crates use `.workspace = true`, which cargo-deny treats as a wildcard.
wildcards = "allow"
workspace-default-features = "allow"
deny = []
skip = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
