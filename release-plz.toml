[workspace]
# Update CHANGELOG.md with release notes
changelog_update = true
# Git tag format
git_tag_name = "v{{ version }}"
# GitHub Releases are created by .github/workflows/release.yml when a v* tag
# is pushed, so the release contains the built binaries. crates.io stays off
# until the registry account has a verified email.
git_release_enable = false
# Don't release packages that haven't changed
release_always = false
# Changelog configuration
changelog_config = "cliff.toml"

# No crates.io publish until the registry account verifies its email.
[[package]]
name = "ragfs"
publish = false
git_release_enable = false

[[package]]
name = "ragfs-core"
publish = false

[[package]]
name = "ragfs-store"
publish = false

[[package]]
name = "ragfs-embed"
publish = false

[[package]]
name = "ragfs-extract"
publish = false

[[package]]
name = "ragfs-chunker"
publish = false

[[package]]
name = "ragfs-index"
publish = false

[[package]]
name = "ragfs-query"
publish = false

[[package]]
name = "ragfs-fuse"
publish = false
